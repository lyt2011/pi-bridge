[project]
name = "pi-bridge"
version = "0.5.0"
description = "PI AGENT 的 Python 后端封装"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "orjson>=3.10",
    "easy-factory>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

